<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>贪吃蛇游戏</title>
    <link rel="stylesheet" href="frontend/style.css">
    <style>
body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(120deg, #e0f7fa 0%, #f0f0f0 100%);
    text-align: center;
    margin: 0;
    padding: 0;
}

h1 {
    margin-top: 20px;
    color: #388e3c;
    letter-spacing: 2px;
    text-shadow: 1px 1px 2px #b2dfdb;
}

#mode-switch {
    margin: 20px 0;
}

#mode-switch button {
    padding: 10px 20px;
    margin: 0 10px;
    font-size: 16px;
    cursor: pointer;
}

#game-canvas {
    background: #222;
    display: block;
    margin: 0 auto;
    border: 2px solid #333;
    box-shadow: 0 4px 24px rgba(76,175,80,0.15);
}

#score-board {
    margin: 20px 0;
    font-size: 18px;
}

#user-section {
    margin: 20px 0;
}

#username-input {
    padding: 6px 12px;
    font-size: 16px;
    border-radius: 4px;
    border: 1px solid #ccc;
}

#save-json-btn {
    padding: 10px 20px;
    font-size: 16px;
    margin-top: 10px;
    cursor: pointer;
}

.secondary-btn {
    background: #fff;
    color: #4CAF50;
    border: 2px solid #4CAF50;
    border-radius: 4px;
    padding: 10px 20px;
    font-size: 16px;
    margin-left: 10px;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
}
.secondary-btn:hover {
    background: #4CAF50;
    color: #fff;
}
    </style>
</head>
<body>
    <h1>贪吃蛇游戏</h1>
    <div id="user-section">
        <label for="username-input">用户名：</label>
        <input type="text" id="username-input" placeholder="请输入用户名">
    </div>
    <button id="manual-mode-btn">开始游戏</button>
    <canvas id="game-canvas" width="400" height="400"></canvas>
    <div id="score-board">
        <span>当前分数: <span id="current-score">0</span></span>
    </div>
    <a href="https://data.page/json/csv" target="_blank">JSON转CSV工具（data.page）</a>
    <button id="save-json-btn">保存游戏过程</button>
    <script src="frontend/snake.js"></script>
</body>
</html>
